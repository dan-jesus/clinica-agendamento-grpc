name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Permissão do Maven Wrapper
        run: chmod +x mvnw

      - name: Build Maven
        run: ./mvnw -B clean verify

      - name: Validar Docker Compose
        run: docker compose config
