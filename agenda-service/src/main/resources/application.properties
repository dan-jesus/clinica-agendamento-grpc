spring.application.name=agenda-service
# Sem servidor HTTP: o serviço só atende gRPC.
spring.main.web-application-type=none
spring.grpc.server.port=${GRPC_PORT:9090}

# Canal gRPC para o paciente-service (usado ao agendar).
spring.grpc.client.channel.paciente.target=${PACIENTE_GRPC_TARGET:static://localhost:9091}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinica_t2}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
