spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

# Canais gRPC para os microsservicos
spring.grpc.client.channel.pacientes.target=${PACIENTE_GRPC_TARGET:static://localhost:9091}
spring.grpc.client.channel.agenda.target=${AGENDA_GRPC_TARGET:static://localhost:9090}
app.grpc.deadline=${GRPC_DEADLINE:5s}

# Usuario unico e JWT
app.auth.username=${APP_USERNAME:admin}
app.auth.password=${APP_PASSWORD:admin}
app.jwt.secret=${JWT_SECRET:segredo-didatico-da-clinica-odontologica-com-mais-de-32-bytes}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
