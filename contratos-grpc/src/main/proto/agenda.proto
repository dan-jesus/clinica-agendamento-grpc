syntax = "proto3";

package agenda;

option java_multiple_files = true;
option java_package = "clinica.grpc";

service AgendaService {
  rpc ConsultarDisponibilidade(ConsultarDisponibilidadeRequest) returns (ConsultarDisponibilidadeResponse);
  rpc AgendarConsulta(AgendarConsultaRequest) returns (AgendarConsultaResponse);
  rpc ListarConsultas(ListarConsultasRequest) returns (ListarConsultasResponse);
}

enum Procedimento {
  PROCEDIMENTO_NAO_INFORMADO = 0;
  LIMPEZA = 1;
  RESTAURACAO = 2;
  CANAL = 3;
  EXTRACAO = 4;
  CLAREAMENTO = 5;
}

message ConsultarDisponibilidadeRequest {
  string data = 1;
}

message ConsultarDisponibilidadeResponse {
  string data = 1;
  repeated string horarios_livres = 2;
}

message AgendarConsultaRequest {
  // Campo mantido por compatibilidade com o Trabalho 1.
  string paciente = 1;
  Procedimento procedimento = 2;
  string data = 3;
  string horario = 4;
  // No Trabalho 2 o Gateway resolve o paciente no cadastro-service e envia o ID.
  int64 paciente_id = 5;
}

message AgendarConsultaResponse {
  bool confirmado = 1;
  string protocolo = 2;
  string mensagem = 3;
  repeated string horarios_alternativos = 4;
  int64 consulta_id = 5;
}

message ListarConsultasRequest {
  // Opcional. Vazio lista todas; preenchido usa dd/MM/aaaa.
  string data = 1;
}

message Consulta {
  int64 id = 1;
  string protocolo = 2;
  int64 paciente_id = 3;
  string paciente = 4;
  Procedimento procedimento = 5;
  string data = 6;
  string horario = 7;
  string criado_em = 8;
}

message ListarConsultasResponse {
  repeated Consulta consultas = 1;
}
