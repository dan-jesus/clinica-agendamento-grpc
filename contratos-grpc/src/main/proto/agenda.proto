syntax = "proto3";

package clinica.agenda;

option java_multiple_files = true;
option java_package = "clinica.grpc.agenda";
option java_outer_classname = "AgendaProto";

// Agenda da clínica (tabela consultas). Ao agendar, consulta o
// PacienteService via gRPC para validar o paciente.
service AgendaService {
  // INVALID_ARGUMENT: data inválida ou no passado.
  rpc ConsultarDisponibilidade(ConsultarDisponibilidadeRequest) returns (ConsultarDisponibilidadeResponse);

  // INVALID_ARGUMENT: dados inválidos. NOT_FOUND: paciente inexistente.
  // ALREADY_EXISTS: horário já ocupado. UNAVAILABLE: serviço de pacientes fora do ar.
  rpc AgendarConsulta(AgendarConsultaRequest) returns (Consulta);

  rpc ListarConsultas(ListarConsultasRequest) returns (ListarConsultasResponse);
}

enum Procedimento {
  PROCEDIMENTO_NAO_INFORMADO = 0;
  LIMPEZA = 1;
  RESTAURACAO = 2;
  CANAL = 3;
  EXTRACAO = 4;
  CLAREAMENTO = 5;
}

message ConsultarDisponibilidadeRequest {
  string data = 1; // yyyy-MM-dd
}

message ConsultarDisponibilidadeResponse {
  string data = 1;
  repeated string horarios_livres = 2; // HH:mm
}

message AgendarConsultaRequest {
  int64 paciente_id = 1;
  Procedimento procedimento = 2;
  string data = 3;    // yyyy-MM-dd
  string horario = 4; // HH:mm
}

message Consulta {
  int64 id = 1;
  string protocolo = 2;
  int64 paciente_id = 3;
  string paciente_nome = 4;
  Procedimento procedimento = 5;
  string data = 6;
  string horario = 7;
  string criado_em = 8; // ISO-8601
}

message ListarConsultasRequest {
  string data = 1; // yyyy-MM-dd; vazio = todas
}

message ListarConsultasResponse {
  repeated Consulta consultas = 1;
}
