<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="aTeal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/></marker>
    <marker id="aSlate" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="aGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#FFFFFF"/>
  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Clínica Sorriso Pleno — Arquitetura de microsserviços</text>

  <!-- Navegador -->
  <rect x="20" y="105" width="180" height="130" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="110" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Navegador</text>
  <text x="110" y="167" text-anchor="middle" font-size="12" fill="#475569">(notebook do</text>
  <text x="110" y="184" text-anchor="middle" font-size="12" fill="#475569">apresentador)</text>
  <text x="110" y="210" text-anchor="middle" font-size="12" fill="#475569">Frontend HTML/CSS/JS</text>

  <!-- Seta REST -->
  <line x1="200" y1="170" x2="365" y2="170" stroke="#0D9488" stroke-width="2.5" marker-end="url(#aTeal)"/>
  <text x="270" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#0D9488">REST / JSON + JWT</text>
  <text x="270" y="157" text-anchor="middle" font-size="12" fill="#0D9488">HTTP :8080</text>

  <!-- VM -->
  <rect x="340" y="50" width="560" height="520" rx="14" fill="#F0FDFA" stroke="#14B8A6" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="360" y="76" font-size="15" font-weight="700" fill="#0D9488">Google Cloud — VM Compute Engine</text>

  <!-- Gateway -->
  <rect x="365" y="100" width="510" height="140" rx="10" fill="#0D9488"/>
  <text x="620" y="135" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">API Gateway (Spring Boot)</text>
  <text x="620" y="162" text-anchor="middle" font-size="13" fill="#F0FDFA">JWT, validação, JSON ↔ Protobuf</text>
  <text x="620" y="190" text-anchor="middle" font-size="13" fill="#CCFBF1">Serve o frontend · única porta pública: 8080</text>

  <!-- gRPC gateway -> servicos -->
  <line x1="470" y1="240" x2="470" y2="318" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#aSlate)"/>
  <text x="482" y="272" font-size="12" font-weight="700" fill="#475569">gRPC / Protobuf</text>
  <text x="482" y="289" font-size="12" fill="#475569">:9090</text>
  <line x1="770" y1="240" x2="770" y2="318" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#aSlate)"/>
  <text x="782" y="272" font-size="12" font-weight="700" fill="#475569">gRPC / Protobuf</text>
  <text x="782" y="289" font-size="12" fill="#475569">:9091</text>

  <!-- agenda-service -->
  <rect x="365" y="320" width="210" height="110" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="2.5"/>
  <text x="470" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">agenda-service</text>
  <text x="470" y="384" text-anchor="middle" font-size="12" fill="#475569">gRPC :9090</text>
  <text x="470" y="404" text-anchor="middle" font-size="12" fill="#475569">grade e agendamentos</text>

  <!-- paciente-service -->
  <rect x="665" y="320" width="210" height="110" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="2.5"/>
  <text x="770" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">paciente-service</text>
  <text x="770" y="384" text-anchor="middle" font-size="12" fill="#475569">gRPC :9091</text>
  <text x="770" y="404" text-anchor="middle" font-size="12" fill="#475569">cadastro de pacientes</text>

  <!-- agenda -> paciente -->
  <line x1="575" y1="385" x2="663" y2="385" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#aSlate)"/>
  <text x="620" y="350" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">gRPC</text>
  <text x="620" y="366" text-anchor="middle" font-size="11" fill="#475569">BuscarPaciente</text>

  <text x="620" y="545" text-anchor="middle" font-size="12" fill="#475569">Portas gRPC 9090/9091 sem regra de firewall: não acessíveis de fora da VM</text>

  <!-- Cloud SQL -->
  <rect x="1000" y="150" width="180" height="420" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  <text x="1090" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Cloud SQL</text>
  <text x="1090" y="202" text-anchor="middle" font-size="13" fill="#475569">PostgreSQL</text>
  <text x="1090" y="222" text-anchor="middle" font-size="13" fill="#475569">(clinica_t2)</text>
  <rect x="1020" y="345" width="140" height="60" rx="8" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="1090" y="381" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">pacientes</text>
  <rect x="1020" y="470" width="140" height="60" rx="8" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="1090" y="506" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">consultas</text>

  <!-- JPA/JDBC -->
  <line x1="875" y1="375" x2="1018" y2="375" stroke="#64748B" stroke-width="2" marker-end="url(#aGray)"/>
  <text x="946" y="364" text-anchor="middle" font-size="12" fill="#475569">JPA / JDBC</text>
  <path d="M470,430 L470,500 L1018,500" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#aGray)"/>
  <text x="800" y="490" text-anchor="middle" font-size="12" fill="#475569">JPA / JDBC</text>

  <!-- Legenda -->
  <g transform="translate(20,596)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#0D9488" stroke-width="2.5"/>
    <text x="48" y="4" font-size="12" fill="#334155">REST/JSON (externo)</text>
    <line x1="200" y1="0" x2="240" y2="0" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 4"/>
    <text x="248" y="4" font-size="12" fill="#334155">gRPC/Protobuf (interno)</text>
    <line x1="420" y1="0" x2="460" y2="0" stroke="#64748B" stroke-width="2"/>
    <text x="468" y="4" font-size="12" fill="#334155">JPA/JDBC (banco)</text>
  </g>
</svg>
